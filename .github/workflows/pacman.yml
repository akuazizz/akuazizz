name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # tiap hari jam 00:00 UTC
  workflow_dispatch:

jobs:
  generate-pacman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate the pacman contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: akuazizz
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg

      - name: Push SVG to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}