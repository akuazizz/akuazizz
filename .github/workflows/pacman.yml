name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-pacman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Clone Pacman Generator Repo
        run: |
          git clone https://github.com/wonnydev/github-contribution-graph-generator.git
          cd github-contribution-graph-generator
          npm install
          npm run generate akuazizz --theme pacman --output ../dist/pacman-contribution-graph.svg
        shell: bash

      - name: Push SVG to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}